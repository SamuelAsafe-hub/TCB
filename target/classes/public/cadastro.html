<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
</head>
<body>

  <h1>Cadastrar</h1>
  <form id="formCadastro" action="/api/usuarios" method="post">

  <label for="nickname">Nickname:</label><br>
  <input id="nickname" placeholder="Cadastre um nickname"><br><br>

  <label for="senha">Senha:</label><br>

  <button id="btnCadastrar">Cadastrar</button>

  <p id="mensagem"></p>

  </form>

  <p>Já possui conta? <a href="login.html">Fazer Login</a></p>

  <script src="cadastrar.js"></script>
</body>
</html>
